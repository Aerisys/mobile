name: mobile
description: "Locate your bro with a NOTIFICATION"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:

  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  firebase_storage: ^13.0.5
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.5.0
  get_it: ^9.2.0
  go_router: ^17.0.1
  image_picker: ^1.2.1
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.4
  font_awesome_flutter: ^10.12.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter:

  uses-material-design: true
  assets:
    - assets/images/logo.svg
    - assets/images/background.jpg
  
  fonts:
    - family: HansonBold
      fonts:
        - asset: assets/fonts/Hanson-Bold.ttf
    - family: NeueHaasDisplay
      fonts:
        - asset: assets/fonts/grotesk/NeueHaasDisplayBlack.ttf
          weight: 900
        - asset: assets/fonts/grotesk/NeueHaasDisplayBlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/grotesk/NeueHaasDisplayBold.ttf
          weight: 700
        - asset: assets/fonts/grotesk/NeueHaasDisplayBoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/grotesk/NeueHaasDisplayLight.ttf
          weight: 300
        - asset: assets/fonts/grotesk/NeueHaasDisplayLightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/grotesk/NeueHaasDisplayMedium.ttf
          weight: 500
        - asset: assets/fonts/grotesk/NeueHaasDisplayMediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/grotesk/NeueHaasDisplayRoman.ttf
          weight: 400
        - asset: assets/fonts/grotesk/NeueHaasDisplayRomanItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/grotesk/NeueHaasDisplayThin.ttf
          weight: 300
        - asset: assets/fonts/grotesk/NeueHaasDisplayThinItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/grotesk/NeueHaasDisplayXThin.ttf
          weight: 200
        - asset: assets/fonts/grotesk/NeueHaasDisplayXThinItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/grotesk/NeueHaasDisplayXXThin.ttf
          weight: 100
        - asset: assets/fonts/grotesk/NeueHaasDisplayXXThinItalic.ttf
          weight: 100
          style: italic